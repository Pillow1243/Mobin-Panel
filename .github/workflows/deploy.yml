# Mobin Panel — CI/CD
# Created by Mobin.A
#
# Push to main → typecheck → test → build → deploy to Cloudflare Workers.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   Worker Routes:Edit + Workers KV:Edit token
#   CLOUDFLARE_ACCOUNT_ID  your Cloudflare account id
#   MOBIN_KV_ID            KV namespace id (create: wrangler kv:namespace create MOBIN_KV)

name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --reporter=verbose

      - name: Production build
        run: NODE_ENV=production npm run build

      - name: Check bundle size
        run: |
          SIZE=$(stat -c%s dist/worker.js)
          echo "bundle: ${SIZE} bytes"
          if [ "$SIZE" -gt 1048576 ]; then
            echo "::error::bundle exceeds 1MB"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: dist/worker.js
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inject KV namespace id
        run: sed -i "s/YOUR_KV_NAMESPACE_ID/${{ secrets.MOBIN_KV_ID }}/" wrangler.toml

      - name: Production build
        run: NODE_ENV=production npm run build

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify
